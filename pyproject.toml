[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lossers"
dynamic = ["version"]
description = "Deep Learning Loss Function"
authors = [
    {name = "Jiau Zhang", email = "jiauzhang@163.com"},
]
requires-python = ">=3.10"
license = {text = "GPL-2.0"}
readme = "README.md"
keywords = [
    "Deep Learning",
    "Loss Function",
    "Artificial Intelligence",
]
dependencies = [
    "torch>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.17.0",
]

[project.urls]
Homepage = "https://github.com/JiauZhang/lossers"

[tool.hatch.version]
path = "lossers/version.py"

[tool.hatch.build.targets.wheel]
packages = ["lossers"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "PLC0415"]
